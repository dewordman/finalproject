
# configs/decision_table.yaml
# Decision rules for the e-mail threat decision-support prototype.
# t_low and t_high must be non-null floats with t_low < t_high. Justify the values in the
# thesis from the validation reliability table; they are decision rules, not probabilities
# of organisational harm.
rule_version: "1.1" # Increment version to show it was updated based on validation

t_low: 0.40
t_high: 0.95

actions:
  Legitimate:
    low: "Review"
    moderate: "Moderate confidence; analyst verification recommended"
    high: "Allow (advisory only)"
  Spam:
    low: "Review"
    moderate: "Moderate confidence; analyst verification recommended"
    high: "Move to junk folder"
  Phishing:
    low: "Review"
    moderate: "Moderate confidence; analyst verification recommended"
    high: "Verify the sender through a separate channel, quarantine for analyst review and escalate"
